<!doctype html><html><head><meta charset="utf-8">
<style>.fresh-feed-hidden{display:none!important}</style></head><body>
<ytd-browse page-subtype="subscriptions"><ytd-rich-item-renderer id="abo-alt"><span>vor 2 Jahren</span></ytd-rich-item-renderer></ytd-browse>
<ytd-browse page-subtype="home"><div id="contents">
  <ytd-rich-item-renderer id="neu"><yt-lockup-view-model><h3><span>Was ich vor 3 Jahren gelernt habe</span></h3>
    <div><span>Kanal</span></div><div><span>1.234 Aufrufe</span><span>•</span><span>vor 2 Wochen</span></div></yt-lockup-view-model></ytd-rich-item-renderer>
  <ytd-rich-item-renderer id="alt"><yt-lockup-view-model><h3><span>Altes Video</span></h3>
    <div><span>5.678 Aufrufe</span><span>•</span><span id="altdatum">vor 3 Jahren</span></div></yt-lockup-view-model></ytd-rich-item-renderer>
  <ytd-rich-item-renderer id="einknoten"><div><span>99 Aufrufe • vor 2 Monaten</span></div></ytd-rich-item-renderer>
  <ytd-rich-item-renderer id="grenze"><span>vor 4 Wochen</span></ytd-rich-item-renderer>
  <ytd-rich-item-renderer id="live"><span>12 Zuschauer</span><span>LIVE</span></ytd-rich-item-renderer>
</div></ytd-browse>
<script>
  // Ersatz für chrome.storage, damit content.js auch ohne Erweiterungsumgebung läuft
  const hoerer = [];
  window.chrome = { storage: {
    local: { get: (standard) => Promise.resolve({ ...standard }) },
    onChanged: { addListener: (f) => hoerer.push(f) },
  } };
  const grenzeSetzen = (tage) => hoerer.forEach((f) => f({ maxTage: { newValue: tage } }));
  const zustand = (name) => name + ': ' + [...document.querySelectorAll('ytd-rich-item-renderer')]
    .map((e) => e.id + '=' + (e.classList.contains('fresh-feed-hidden') ? 'AUS' : 'an')).join(' ');
</script>
<script src="../content.js"></script>
<script>
  const ergebnis = [];
  setTimeout(() => { // Endlos-Scroll und Kachel-Recycling simulieren
    document.getElementById('contents').insertAdjacentHTML('beforeend',
      '<ytd-rich-item-renderer id="nachgeladen"><span>5mo ago</span></ytd-rich-item-renderer>');
    document.getElementById('altdatum').textContent = 'vor 1 Tag';
  }, 500);
  setTimeout(() => { ergebnis.push(zustand('28 Tage')); grenzeSetzen(7); }, 1000);
  setTimeout(() => { ergebnis.push(zustand('7 Tage')); grenzeSetzen(1825); }, 1500);
  setTimeout(() => { ergebnis.push(zustand('5 Jahre')); document.title = ergebnis.join(' | '); }, 2000);
</script></body></html>
